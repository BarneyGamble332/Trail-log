name: Erkunden (temporär)
on: workflow_dispatch
jobs:
  e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: ATKIS WFS
        run: |
          U='https://geoservices.bayern.de/wfs/v1/ogc_atkis_basisdlm.cgi'
          curl -sS "$U?service=WFS&version=2.0.0&request=GetCapabilities" -o cap.xml
          python3 - <<'PY'
          import re
          s=open('cap.xml').read()
          i=s.find('FeatureType>'); print(s[i-200:i+1500])
          names=re.findall(r'<(?:\w+:)?Name>([^<]+)</(?:\w+:)?Name>',s)
          print('NAMES',len(names)); print(' '.join(names))
          open('names.txt','w').write('\n'.join(n for n in names if re.search(r'(?i)weg|strass|pfad|fahr',n)))
          PY
          for t in $(cat names.txt); do
            echo "==== $t"
            curl -sS --max-time 60 "$U?service=WFS&version=2.0.0&request=DescribeFeatureType&typeNames=$t" | grep -o 'name="[^"]*"' | tr '\n' ' ' | head -c 2500; echo
            curl -sS --max-time 90 "$U?service=WFS&version=2.0.0&request=GetFeature&typeNames=$t&count=3&srsName=urn:ogc:def:crs:EPSG::4326&bbox=47.47,11.05,47.51,11.12,urn:ogc:def:crs:EPSG::4326" | head -c 3500; echo
          done
