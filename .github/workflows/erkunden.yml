name: Erkunden (temporär)
on: workflow_dispatch
jobs:
  e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: ATKIS WFS
        run: |
          U='https://geoservices.bayern.de/wfs/v1/ogc_atkis_basisdlm.cgi'
          NS='namespaces=xmlns(adv,http://www.adv-online.de/namespaces/adv/gid/7.1)'
          B='bbox=47.46,11.03,47.52,11.13,urn:ogc:def:crs:EPSG::4326'
          for t in adv:AX_Fahrwegachse adv:AX_WegPfadSteig; do
            echo "==== $t hits"
            curl -sS --max-time 90 "$U?service=WFS&version=2.0.0&request=GetFeature&typeNames=$t&resultType=hits&$NS&$B" | head -c 600; echo
            echo "==== $t sample"
            curl -sS --max-time 90 "$U?service=WFS&version=2.0.0&request=GetFeature&typeNames=$t&count=3&srsName=urn:ogc:def:crs:EPSG::4326&$NS&$B" -o s.xml
            head -c 5000 s.xml; echo
            echo "==== $t Werte (200)"
            curl -sS --max-time 120 "$U?service=WFS&version=2.0.0&request=GetFeature&typeNames=$t&count=300&$NS&$B" -o v.xml
            for k in funktion befestigung befahrbarkeit art breiteDesVerkehrsweges markierung; do
              echo "-- $k: $(grep -o "<adv:$k>[^<]*<" v.xml | sed -E 's/.*>//;s/<$//' | sort | uniq -c | sort -rn | tr '\n' ' ')"
            done
            ls -la v.xml
          done
