name: Offline-Karten bauen

# Baut die MTB-Karten aus OpenStreetMap und Höhendaten (karte/regionen.json)
# und legt sie im Release "karten" ab. Danach wird die Seite neu veröffentlicht,
# damit die App sie zur Vorschau und zum Download findet.
on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Nur diese Region bauen (leer = alle)'
        required: false
        default: ''
  schedule:
    - cron: '17 3 1 * *'   # monatlich am 1., aktuelle OSM-Daten
  push:
    branches: [main]
    paths:
      - karte/schema.yml
      - karte/regionen.json
      - karte/bauen.py
      - .github/workflows/karte.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: karten
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool gdal-bin >/dev/null
          osmium --version | head -1
          gdalinfo --version
          mkdir -p work
          curl -fsSL -o work/planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar
          ls -la work/planetiler.jar
          df -h . | tail -1

      - name: Karten bauen
        run: python3 karte/bauen.py ${{ github.event.inputs.region }}

      - name: Im Release "karten" ablegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la out
          gh release view karten >/dev/null 2>&1 || gh release create karten --title "Offline-Karten" \
            --notes "Kartendaten für die Offline-Karte in Trail Log. Wird automatisch gebaut, nicht von Hand ändern."
          for m in out/*.json; do
            id=$(basename "$m" .json)
            # alte Teile dieser Region entfernen, sonst bleiben überzählige Teile liegen
            for a in $(gh release view karten --json assets -q '.assets[].name' | grep -E "^${id}(-[0-9]{3}\.bin|\.json)$" || true); do
              gh release delete-asset karten "$a" -y
            done
          done
          gh release upload karten out/* --clobber

      - name: Seite neu veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run seite.yml --ref main
