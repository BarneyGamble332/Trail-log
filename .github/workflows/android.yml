          python3 - <<'PY'
          m='android/app/src/main/AndroidManifest.xml'
          s=open(m).read()
          rec='''        <receiver android:name=".TrailWidgetProvider" android:exported="false" android:label="@string/widget_rad">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
