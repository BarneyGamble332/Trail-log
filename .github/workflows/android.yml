name: Android-App bauen

on:
  workflow_dispatch:
  push:
    paths:
      - index.html
      - .github/workflows/android.yml

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Capacitor-Projekt erzeugen
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # 1) Web-App ins Capacitor-Projekt
          mkdir -p www && sed "s/__BUILD__/1.${RUN_NUMBER:-1}/" index.html > www/index.html
          npm init -y >/dev/null
          npm i --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor-community/background-geolocation@1.2.20
          npx cap init "Trail Log" de.bernhard.traillog --web-dir www
          npx cap add android
          npx cap sync android
          RES=android/app/src/main/res
          # 2) App-Symbol: gelber Hintergrund, dunkler Berg, roter Punkt
          sed -i 's/#FFFFFF/#F2C000/' $RES/values/ic_launcher_background.xml
          pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          S=432
          fg=Image.new('RGBA',(S,S),(0,0,0,0)); d=ImageDraw.Draw(fg)
          d.polygon([(110,300),(185,165),(232,238),(272,185),(322,300)],fill='#1b1f24')
          d.ellipse([200,316,232,348],fill='#d93025')
          bg=Image.new('RGBA',(S,S),'#F2C000'); bg.alpha_composite(fg)
          res='android/app/src/main/res/'
          for n,s,f in [('mdpi',48,108),('hdpi',72,162),('xhdpi',96,216),('xxhdpi',144,324),('xxxhdpi',192,432)]:
              fg.resize((f,f),Image.LANCZOS).save(res+'mipmap-%s/ic_launcher_foreground.png'%n)
              ic=bg.resize((s,s),Image.LANCZOS)
              ic.save(res+'mipmap-%s/ic_launcher.png'%n); ic.save(res+'mipmap-%s/ic_launcher_round.png'%n)
          PY
          # 3) Versionsnummer hochzaehlen, damit Updates ueber die alte Installation moeglich sind
          sed -i "s/versionCode 1/versionCode ${RUN_NUMBER:-1}/; s/versionName \"1.0\"/versionName \"1.${RUN_NUMBER:-1}\"/" android/app/build.gradle

      - name: Signaturschluessel einsetzen (gleich bei jedem Build, damit Updates klappen)
        run: |
          mkdir -p ~/.android
          echo '' | base64 -d > ~/.android/debug.keystore

      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK als Download bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Trail-Log.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Trail-Log.apk --title "Trail Log (Android)" --notes "Neueste Android-App. Datei Trail-Log.apk laden und installieren."
