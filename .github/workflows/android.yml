name: Android-App bauen

on:
  workflow_dispatch:
  push:
    paths:
      - index.html
      - .github/workflows/android.yml
      - karte/fonts/**
      - icon/**

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Capacitor-Projekt erzeugen
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # 1) Web-App ins Capacitor-Projekt
          mkdir -p www && sed "s/__BUILD__/1.${RUN_NUMBER:-1}/" index.html > www/index.html
          # Bibliotheken und Kartenschriften in die App packen: sie startet dann ohne Netz
          # und kann die heruntergeladene MTB-Karte komplett offline zeichnen
          mkdir -p libs
          (cd libs && npm init -y >/dev/null && npm i --no-audit --no-fund leaflet@1.9.4 maplibre-gl@5.24.0 @maplibre/maplibre-gl-leaflet@0.1.4 pmtiles@4.5.0 @zip.js/zip.js@2.7.52 >/dev/null)
          for p in leaflet@1.9.4 maplibre-gl@5.24.0 @maplibre/maplibre-gl-leaflet@0.1.4 pmtiles@4.5.0 @zip.js/zip.js@2.7.52; do
            mkdir -p "www/lib/npm/$p" && cp -r "libs/node_modules/${p%@*}/dist" "www/lib/npm/$p/"
          done
          sed -i 's#https://cdn.jsdelivr.net/npm/#lib/npm/#g; s#https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/#lib/npm/leaflet@1.9.4/dist/#g' www/index.html
          ! grep -n -E 'https://(cdn\.jsdelivr\.net|cdnjs\.cloudflare\.com)' www/index.html
          mkdir -p www/karte && cp -r karte/fonts www/karte/
          rm -rf libs
          npm init -y >/dev/null
          npm i --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor-community/background-geolocation@1.2.20
          npx cap init "Trail Log" de.bernhard.traillog --web-dir www
          # Ohne useLegacyBridge drosselt Android die GPS-Übergabe an die App im Hintergrund (Plugin-Doku)
          node -e "const f='capacitor.config.json',c=require('./'+f);c.android=Object.assign(c.android||{},{useLegacyBridge:true});require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          cat capacitor.config.json
          npx cap add android
          npx cap sync android
          RES=android/app/src/main/res
          # 2) App-Symbol aus icon/app-symbol.png (eigene Heatmap, nur Spuren auf dunklem Grund)
          sed -i 's/#FFFFFF/#15181C/' $RES/values/ic_launcher_background.xml
          pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          src=Image.open('icon/app-symbol.png').convert('RGBA')   # 108 dp, sichtbar ist die Mitte (72 dp)
          res='android/app/src/main/res/'
          for n,s,f in [('mdpi',48,108),('hdpi',72,162),('xhdpi',96,216),('xxhdpi',144,324),('xxxhdpi',192,432)]:
              src.resize((f,f),Image.LANCZOS).save(res+'mipmap-%s/ic_launcher_foreground.png'%n)
              k=src.size[0]; c=round(k*18/108)
              ic=src.crop((c,c,k-c,k-c)).resize((s,s),Image.LANCZOS)
              ic.save(res+'mipmap-%s/ic_launcher.png'%n)
              m=Image.new('L',(s*4,s*4),0); ImageDraw.Draw(m).ellipse([0,0,s*4-1,s*4-1],fill=255)
              r=Image.new('RGBA',(s,s),(0,0,0,0)); r.paste(ic,(0,0),m.resize((s,s),Image.LANCZOS))
              r.save(res+'mipmap-%s/ic_launcher_round.png'%n)
          PY
          # 3) Versionsnummer hochzaehlen, damit Updates ueber die alte Installation moeglich sind
          sed -i "s/versionCode 1/versionCode ${RUN_NUMBER:-1}/; s/versionName \"1.0\"/versionName \"1.${RUN_NUMBER:-1}\"/" android/app/build.gradle
          # 4) Widget fuer den Startbildschirm: Java-Klassen, Layout, Manifest
          PKG=android/app/src/main/java/de/bernhard/traillog
          RES=android/app/src/main/res
          MAN=android/app/src/main/AndroidManifest.xml
          mkdir -p $RES/layout $RES/xml $RES/drawable

          cat > $PKG/MainActivity.java <<'JAVA'
          package de.bernhard.traillog;

          import android.content.Intent;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(TrailWidgetPlugin.class);
                  registerPlugin(TrailPhotosPlugin.class);
                  super.onCreate(savedInstanceState);
                  if (savedInstanceState == null) handleWidgetIntent(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  handleWidgetIntent(intent);
              }

              private void handleWidgetIntent(Intent intent) {
                  if (intent == null) return;
                  String a = intent.getStringExtra("tl_action");
                  if (a != null) {
                      intent.removeExtra("tl_action");
                      TrailWidgetPlugin.post(a);
                  }
              }
          }
          JAVA

          cat > $PKG/TrailWidgetPlugin.java <<'JAVA'
          package de.bernhard.traillog;

          import android.Manifest;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.view.Surface;
          import android.view.WindowManager;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.PowerManager;
          import android.provider.Settings;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "TrailWidget")
          public class TrailWidgetPlugin extends Plugin implements SensorEventListener {

              /* Kompass aus dem Rotationsvektor (Magnetometer + Gyro + Beschleunigung, von Android fusioniert).
                 Liegt das Handy flach: Richtung der Oberkante. Steht es aufrecht: Blickrichtung der Rückkamera. */
              private SensorManager sm;
              private final float[] rm = new float[9];
              private long lastSent = 0;
              private double lastH = -1000;

              /* Nach Start aus dem Widget: App wieder verschwinden lassen, Aufnahme läuft im Hintergrund weiter */
              @PluginMethod
              public void toBackground(PluginCall call) {
                  if (getActivity() != null) getActivity().runOnUiThread(() -> {
                      getActivity().moveTaskToBack(true);
                      getActivity().overridePendingTransition(0, 0);
                  });
                  call.resolve();
              }

              @PluginMethod
              public void startCompass(PluginCall call) {
                  if (sm == null) sm = (SensorManager) getContext().getSystemService(android.content.Context.SENSOR_SERVICE);
                  Sensor s = sm == null ? null : sm.getDefaultSensor(Sensor.TYPE_ROTATION_VECTOR);
                  if (s == null) { call.reject("Kein Kompass-Sensor"); return; }
                  sm.unregisterListener(this);
                  sm.registerListener(this, s, SensorManager.SENSOR_DELAY_UI);
                  call.resolve();
              }

              @PluginMethod
              public void stopCompass(PluginCall call) {
                  if (sm != null) sm.unregisterListener(this);
                  call.resolve();
              }

              @Override
              public void onSensorChanged(SensorEvent e) {
                  SensorManager.getRotationMatrixFromVector(rm, e.values);
                  double east, north;
                  if (Math.abs(rm[8]) > 0.75) {          // flach: Oberkante des Bildschirms (Drehung beachten)
                      int rot = Surface.ROTATION_0;
                      try { rot = ((WindowManager) getContext().getSystemService(android.content.Context.WINDOW_SERVICE)).getDefaultDisplay().getRotation(); } catch (Exception ignore) {}
                      if (rot == Surface.ROTATION_90) { east = rm[0]; north = rm[3]; }
                      else if (rot == Surface.ROTATION_180) { east = -rm[1]; north = -rm[4]; }
                      else if (rot == Surface.ROTATION_270) { east = -rm[0]; north = -rm[3]; }
                      else { east = rm[1]; north = rm[4]; }
                  } else {                                // aufrecht: Blick durch die Rückseite
                      east = -rm[2]; north = -rm[5];
                  }
                  double h = (Math.toDegrees(Math.atan2(east, north)) + 360) % 360;
                  long now = System.currentTimeMillis();
                  double d = Math.abs(((h - lastH + 540) % 360) - 180);
                  if (now - lastSent < 80 || d < 1) return;
                  lastSent = now; lastH = h;
                  JSObject r = new JSObject();
                  r.put("h", h);
                  r.put("acc", e.accuracy);
                  notifyListeners("compass", r);
              }

              @Override
              public void onAccuracyChanged(Sensor s, int a) {}

              @Override
              protected void handleOnDestroy() { if (sm != null) sm.unregisterListener(this); }
              static TrailWidgetPlugin instance;
              static String pending;

              @Override
              public void load() {
                  instance = this;
                  if (pending != null) {
                      String a = pending;
                      pending = null;
                      fire(a);
                  }
              }

              static void post(String action) {
                  if (instance != null) instance.fire(action);
                  else pending = action;
              }

              private void fire(String action) {
                  JSObject o = new JSObject();
                  o.put("action", action);
                  notifyListeners("widgetAction", o, true);
              }

              @PluginMethod
              public void update(PluginCall call) {
                  boolean running = call.getBoolean("running", false);
                  // getDouble() liefert bei grossen ganzen Zahlen (Millisekunden) den Standardwert 0, daher optLong
                  long start = call.getData().optLong("start", 0L);
                  TrailWidgetProvider.save(getContext(), running, start,
                      call.getString("dist", "0,0"), call.getString("gain", "0"),
                      call.getString("m", ""), call.getString("mt", "–"),
                      call.getString("mk", "–"), call.getString("mh", "–"),
                      call.getString("days", "{}"), call.getString("hdays", "{}"));
                  call.resolve();
              }

              /* Für die Aufnahme bei gesperrtem Handy: Benachrichtigung erlauben (Android 13+)
                 und die App von der Akku-Optimierung ausnehmen, sonst legt Samsung sie schlafen */
              @PluginMethod
              public void bgStatus(PluginCall call) {
                  JSObject r = new JSObject();
                  PowerManager pm = (PowerManager) getContext().getSystemService(android.content.Context.POWER_SERVICE);
                  r.put("battery", pm == null || pm.isIgnoringBatteryOptimizations(getContext().getPackageName()));
                  r.put("notify", Build.VERSION.SDK_INT < 33 ||
                      ContextCompat.checkSelfPermission(getContext(), Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED);
                  call.resolve(r);
              }

              @PluginMethod
              public void requestNotify(PluginCall call) {
                  if (Build.VERSION.SDK_INT >= 33 && getActivity() != null &&
                      ContextCompat.checkSelfPermission(getContext(), Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(getActivity(), new String[]{Manifest.permission.POST_NOTIFICATIONS}, 4711);
                  }
                  call.resolve();
              }

              @PluginMethod
              public void requestBattery(PluginCall call) {
                  try {
                      Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                      i.setData(Uri.parse("package:" + getContext().getPackageName()));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                  } catch (Exception e) {
                      try {
                          Intent i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + getContext().getPackageName()));
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(i);
                      } catch (Exception ignore) {}
                  }
                  call.resolve();
              }

              /* Datei aus dem App-Cache in einen öffentlichen Ordner kopieren, ohne Berechtigung ab Android 10:
                 Bilder -> Bilder/Trail Log (Galerie), sonstige Dateien -> Download/Trail Log */
              @PluginMethod
              public void saveToGallery(PluginCall call) { saveShared(call, true); }

              @PluginMethod
              public void saveToDownloads(PluginCall call) { saveShared(call, false); }

              private void saveShared(PluginCall call, boolean image) {
                  if (Build.VERSION.SDK_INT < 29) { call.reject("Android-Version zu alt"); return; }
                  String src = call.getString("path");
                  String name = call.getString("name", image ? "trail-log.png" : "trail-log.json");
                  String mime = call.getString("mime", image ? "image/png" : "application/json");
                  if (src == null) { call.reject("Kein Pfad"); return; }
                  File f = new File(Uri.parse(src).getPath());
                  ContentResolver cr = getContext().getContentResolver();
                  ContentValues v = new ContentValues();
                  v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                  v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                  v.put(MediaStore.MediaColumns.RELATIVE_PATH, image ? "Pictures/Trail Log" : "Download/Trail Log");
                  v.put(MediaStore.MediaColumns.IS_PENDING, 1);
                  Uri coll = image ? MediaStore.Images.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                                   : MediaStore.Downloads.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY);
                  Uri out = null;
                  try {
                      out = cr.insert(coll, v);
                      if (out == null) throw new Exception("Ordner nicht verfügbar");
                      try (InputStream in = new FileInputStream(f); OutputStream os = cr.openOutputStream(out)) {
                          byte[] buf = new byte[65536];
                          int n;
                          while ((n = in.read(buf)) > 0) os.write(buf, 0, n);
                      }
                      ContentValues done = new ContentValues();
                      done.put(MediaStore.MediaColumns.IS_PENDING, 0);
                      cr.update(out, done, null, null);
                      f.delete();
                      JSObject r = new JSObject();
                      r.put("uri", out.toString());
                      call.resolve(r);
                  } catch (Exception e) {
                      if (out != null) { try { cr.delete(out, null, null); } catch (Exception ignore) {} }
                      call.reject("Speichern fehlgeschlagen: " + e.getMessage());
                  }
              }
          }
          JAVA

          cat > $PKG/TrailPhotosPlugin.java <<'JAVA'
          package de.bernhard.traillog;

          import android.Manifest;
          import android.content.ContentResolver;
          import android.content.ContentUris;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.graphics.Bitmap;
          import android.media.ExifInterface;
          import android.net.Uri;
          import android.os.Build;
          import android.os.ParcelFileDescriptor;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.util.Base64;
          import android.util.Size;
          import androidx.core.content.ContextCompat;
          import java.io.ByteArrayOutputStream;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          /* Fotos aus der Galerie: Aufnahmezeit und Standort (EXIF) lesen, Vorschaubilder liefern.
             Die Fotos bleiben in der Galerie, die App merkt sich nur ID, Zeit und Ort. */
          @CapacitorPlugin(name = "TrailPhotos", permissions = {
              @Permission(alias = "images", strings = { Manifest.permission.READ_MEDIA_IMAGES }),
              @Permission(alias = "selected", strings = { "android.permission.READ_MEDIA_VISUAL_USER_SELECTED" }),
              @Permission(alias = "storage", strings = { Manifest.permission.READ_EXTERNAL_STORAGE }),
              @Permission(alias = "medialoc", strings = { Manifest.permission.ACCESS_MEDIA_LOCATION })
          })
          public class TrailPhotosPlugin extends Plugin {

              private boolean has(String p) {
                  return ContextCompat.checkSelfPermission(getContext(), p) == PackageManager.PERMISSION_GRANTED;
              }
              private boolean full() {
                  return Build.VERSION.SDK_INT >= 33 ? has(Manifest.permission.READ_MEDIA_IMAGES) : has(Manifest.permission.READ_EXTERNAL_STORAGE);
              }
              private boolean partial() {
                  return !full() && Build.VERSION.SDK_INT >= 34 && has("android.permission.READ_MEDIA_VISUAL_USER_SELECTED");
              }
              private boolean loc() {
                  return Build.VERSION.SDK_INT < 29 || has(Manifest.permission.ACCESS_MEDIA_LOCATION);
              }
              private JSObject state() {
                  JSObject r = new JSObject();
                  r.put("access", full() ? "full" : (partial() ? "partial" : "none"));
                  r.put("loc", loc());
                  return r;
              }

              @PluginMethod
              public void status(PluginCall call) { call.resolve(state()); }

              @PluginMethod
              public void request(PluginCall call) {
                  java.util.ArrayList<String> a = new java.util.ArrayList<>();
                  if (Build.VERSION.SDK_INT >= 33) a.add("images"); else a.add("storage");
                  if (Build.VERSION.SDK_INT >= 34) a.add("selected");
                  if (Build.VERSION.SDK_INT >= 29) a.add("medialoc");
                  requestPermissionForAliases(a.toArray(new String[0]), call, "permDone");
              }

              @PermissionCallback
              private void permDone(PluginCall call) {
                  // Standort in Medien hat keinen eigenen Dialog, er wird mit dem Fotozugriff erteilt
                  if (full() && !loc() && Build.VERSION.SDK_INT >= 29 && getPermissionState("medialoc") != PermissionState.GRANTED) {
                      requestPermissionForAlias("medialoc", call, "locDone");
                      return;
                  }
                  call.resolve(state());
              }

              @PermissionCallback
              private void locDone(PluginCall call) { call.resolve(state()); }

              @PluginMethod
              public void openSettings(PluginCall call) {
                  try {
                      Intent i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + getContext().getPackageName()));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                  } catch (Exception ignore) {}
                  call.resolve();
              }

              /* Alle Fotos (oder nur DCIM/Camera) auflisten. Für Fotos, die seit "after" (Sekunden) neu oder geändert sind,
                 werden Zeit und GPS gelesen. "ids" enthält alle vorhandenen Fotos, damit gelöschte aus der App verschwinden. */
              @PluginMethod
              public void scan(PluginCall call) {
                  final long after = call.getData().optLong("after", 0L);
                  final boolean camera = call.getBoolean("camera", true);
                  new Thread(() -> {
                      try {
                          ContentResolver cr = getContext().getContentResolver();
                          Uri base = MediaStore.Images.Media.EXTERNAL_CONTENT_URI;
                          String sel = null; String[] args = null;
                          if (camera) {
                              if (Build.VERSION.SDK_INT >= 29) { sel = MediaStore.MediaColumns.RELATIVE_PATH + " LIKE ?"; args = new String[]{ "DCIM/Camera/%" }; }
                              else { sel = MediaStore.MediaColumns.DATA + " LIKE ?"; args = new String[]{ "%/DCIM/Camera/%" }; }
                          }
                          String[] proj = { MediaStore.MediaColumns._ID, MediaStore.Images.ImageColumns.DATE_TAKEN,
                              MediaStore.MediaColumns.DATE_MODIFIED, MediaStore.MediaColumns.DATE_ADDED };
                          boolean useLoc = loc() && Build.VERSION.SDK_INT >= 29;
                          JSArray items = new JSArray(), ids = new JSArray();
                          long maxMod = after; int done = 0, total = 0;
                          try (Cursor c = cr.query(base, proj, sel, args, MediaStore.MediaColumns.DATE_MODIFIED + " DESC")) {
                              if (c != null) {
                                  total = c.getCount();
                                  while (c.moveToNext()) {
                                      long id = c.getLong(0), taken = c.getLong(1), mod = c.getLong(2), added = c.getLong(3);
                                      ids.put(id);
                                      if (mod > maxMod) maxMod = mod;
                                      if (mod > after) {
                                          Uri u = ContentUris.withAppendedId(base, id);
                                          double lat = Double.NaN, lon = Double.NaN;
                                          long t = taken > 0 ? taken : added * 1000L;
                                          ExifInterface ex = null;
                                          try (ParcelFileDescriptor pf = cr.openFileDescriptor(useLoc ? MediaStore.setRequireOriginal(u) : u, "r")) {
                                              if (pf != null) ex = new ExifInterface(pf.getFileDescriptor());
                                          } catch (Exception e1) {
                                              try (ParcelFileDescriptor pf = cr.openFileDescriptor(u, "r")) {
                                                  if (pf != null) ex = new ExifInterface(pf.getFileDescriptor());
                                              } catch (Exception ignore) {}
                                          }
                                          if (ex != null) {
                                              float[] ll = new float[2];
                                              if (ex.getLatLong(ll) && (ll[0] != 0 || ll[1] != 0)) { lat = ll[0]; lon = ll[1]; }
                                              long et = exifTime(ex);
                                              if (et > 0) t = et;
                                          }
                                          JSObject o = new JSObject();
                                          o.put("id", id);
                                          o.put("t", t);
                                          if (!Double.isNaN(lat)) { o.put("lat", lat); o.put("lon", lon); }
                                          items.put(o);
                                      }
                                      done++;
                                      if (done % 100 == 0) {
                                          JSObject p = new JSObject(); p.put("n", done); p.put("total", total);
                                          notifyListeners("progress", p);
                                      }
                                  }
                              }
                          }
                          JSObject r = new JSObject();
                          r.put("items", items); r.put("ids", ids); r.put("after", maxMod); r.put("loc", useLoc || Build.VERSION.SDK_INT < 29);
                          call.resolve(r);
                      } catch (SecurityException e) {
                          call.reject("Kein Zugriff auf Fotos");
                      } catch (Exception e) {
                          call.reject("Fotos konnten nicht gelesen werden: " + e.getMessage());
                      }
                  }).start();
              }

              /* Aufnahmezeit aus EXIF: mit Zeitzonen-Angabe exakt, sonst als Ortszeit des Handys (mit Sommer-/Winterzeit).
                 Die Zeit von Android (DATE_TAKEN) ist bei Fotos ohne Zeitzone oft um 1-2 Stunden verschoben. */
              private static long exifTime(ExifInterface ex) {
                  String d = ex.getAttribute(ExifInterface.TAG_DATETIME_ORIGINAL);
                  if (d == null || d.trim().length() < 19) d = ex.getAttribute(ExifInterface.TAG_DATETIME);
                  if (d == null || d.trim().length() < 19 || d.startsWith("0000")) return -1;
                  d = d.trim().substring(0, 19);
                  String off = ex.getAttribute("OffsetTimeOriginal");
                  if (off == null) off = ex.getAttribute("OffsetTime");
                  try {
                      java.text.SimpleDateFormat f = new java.text.SimpleDateFormat("yyyy:MM:dd HH:mm:ss", java.util.Locale.US);
                      if (off != null && off.trim().matches("[+-]\\d{2}:\\d{2}")) f.setTimeZone(java.util.TimeZone.getTimeZone("GMT" + off.trim()));
                      else f.setTimeZone(java.util.TimeZone.getDefault());
                      java.util.Date r = f.parse(d);
                      return r == null ? -1 : r.getTime();
                  } catch (Exception e) { return -1; }
              }

              /* Vorschaubild als JPEG-Daten-URL */
              @PluginMethod
              public void thumb(PluginCall call) {
                  final long id = call.getData().optLong("id", -1L);
                  final int size = call.getInt("size", 128);
                  new Thread(() -> {
                      try {
                          Uri u = ContentUris.withAppendedId(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, id);
                          Bitmap b;
                          if (Build.VERSION.SDK_INT >= 29) b = getContext().getContentResolver().loadThumbnail(u, new Size(size, size), null);
                          else b = MediaStore.Images.Thumbnails.getThumbnail(getContext().getContentResolver(), id, MediaStore.Images.Thumbnails.MINI_KIND, null);
                          if (b == null) { call.reject("Kein Bild"); return; }
                          ByteArrayOutputStream os = new ByteArrayOutputStream();
                          b.compress(Bitmap.CompressFormat.JPEG, 82, os);
                          JSObject r = new JSObject();
                          r.put("url", "data:image/jpeg;base64," + Base64.encodeToString(os.toByteArray(), Base64.NO_WRAP));
                          call.resolve(r);
                      } catch (Exception e) {
                          call.reject("Vorschau fehlgeschlagen");
                      }
                  }).start();
              }

              /* Foto in der Galerie-App öffnen */
              @PluginMethod
              public void open(PluginCall call) {
                  long id = call.getData().optLong("id", -1L);
                  try {
                      Uri u = ContentUris.withAppendedId(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, id);
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(u, "image/*");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Foto nicht gefunden");
                  }
              }
          }
