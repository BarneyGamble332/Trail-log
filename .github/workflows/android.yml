          cat > $PKG/TrailWidgetProvider.java <<'JAVA'
          package de.bernhard.traillog;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.SystemClock;
          import android.view.View;
          import android.widget.RemoteViews;
          import java.util.Calendar;
          import java.util.Locale;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class TrailWidgetProvider extends AppWidgetProvider {
              static final String PREF = "tlwidget";

              static void save(Context c, boolean running, long start, String dist, String gain,
                               String month, String tours, String km, String hm, String days, String hdays) {
                  c.getSharedPreferences(PREF, Context.MODE_PRIVATE).edit()
                      .putBoolean("run", running)
                      .putLong("start", start)
                      .putString("dist", dist)
                      .putString("gain", gain)
                      .putString("m", month)
                      .putString("mt", tours)
                      .putString("mk", km)
                      .putString("mh", hm)
                      .putString("days", days)
                      .putString("hdays", hdays)
                      .putLong("ts", System.currentTimeMillis())
                      .apply();
                  refresh(c);
              }

              static void refresh(Context c) {
                  AppWidgetManager m = AppWidgetManager.getInstance(c);
                  for (int id : m.getAppWidgetIds(new ComponentName(c, TrailWidgetProvider.class))) m.updateAppWidget(id, build(c, false));
                  for (int id : m.getAppWidgetIds(new ComponentName(c, TrailWidgetHikeProvider.class))) m.updateAppWidget(id, build(c, true));
              }

              @Override
              public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
                  for (int id : ids) m.updateAppWidget(id, build(c, false));
              }

              static PendingIntent act(Context c, String action, int code) {
                  Intent i = new Intent(c, MainActivity.class);
                  i.setAction("de.bernhard.traillog.WIDGET_" + action);
                  i.putExtra("tl_action", action);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP
                      | (action.startsWith("start") ? Intent.FLAG_ACTIVITY_NO_ANIMATION : 0));
                  return PendingIntent.getActivity(c, code, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              static final int[] DC = {R.id.w_dc0, R.id.w_dc1, R.id.w_dc2, R.id.w_dc3, R.id.w_dc4, R.id.w_dc5, R.id.w_dc6};
              static final int[] DL = {R.id.w_dl0, R.id.w_dl1, R.id.w_dl2, R.id.w_dl3, R.id.w_dl4, R.id.w_dl5, R.id.w_dl6};
              static final int[] DI = {R.id.w_di0, R.id.w_di1, R.id.w_di2, R.id.w_di3, R.id.w_di4, R.id.w_di5, R.id.w_di6};
              static final int[] DK = {R.id.w_dk0, R.id.w_dk1, R.id.w_dk2, R.id.w_dk3, R.id.w_dk4, R.id.w_dk5, R.id.w_dk6};

              static String km1(double v) {
                  String t = String.format(Locale.GERMANY, v >= 100 ? "%.0f" : "%.1f", v);
                  return t.endsWith(",0") ? t.substring(0, t.length() - 2) : t;
              }

              /* Aktuelle Woche (Mo-So) aus Tageswerten {"2026-11-06":[Touren,km,Hm]}.
                 Wird bei jedem Neuzeichnen mit dem heutigen Datum berechnet, stimmt also auch ohne App-Start. */
              static void week(RemoteViews v, SharedPreferences p, boolean hike) {
                  JSONObject days;
                  try { days = new JSONObject(p.getString(hike ? "hdays" : "days", "{}")); } catch (Exception e) { days = new JSONObject(); }
                  Calendar cal = Calendar.getInstance();
                  int today = (cal.get(Calendar.DAY_OF_WEEK) + 5) % 7;
                  cal.add(Calendar.DAY_OF_MONTH, -today);
                  int tours = 0; double km = 0, hm = 0;
                  for (int i = 0; i < 7; i++) {
                      String key = String.format(Locale.US, "%04d-%02d-%02d", cal.get(Calendar.YEAR), cal.get(Calendar.MONTH) + 1, cal.get(Calendar.DAY_OF_MONTH));
                      JSONArray d = days.optJSONArray(key);
                      int n = d == null ? 0 : d.optInt(0, 0);
                      double k = d == null ? 0 : d.optDouble(1, 0);
                      tours += n; km += k; hm += d == null ? 0 : d.optDouble(2, 0);
                      // Bild je Tag: Rad nach Art der längsten Fahrt, Heuballen an vergangenen Tagen ohne Radtour
                      String kind = d == null ? "" : d.optString(3, "r");
                      int img = n > 0 ? (hike ? R.drawable.wd_hike : "m".equals(kind) ? R.drawable.wd_mtb : "e".equals(kind) ? R.drawable.wd_ebike : R.drawable.wd_road)
                                      : (i < today ? R.drawable.wd_none : 0);
                      if (img != 0) { v.setImageViewResource(DI[i], img); v.setViewVisibility(DI[i], View.VISIBLE); }
                      else v.setViewVisibility(DI[i], View.INVISIBLE);
                      v.setTextViewText(DK[i], n > 0 ? km1(k) : "");
                      v.setTextColor(DL[i], i == today ? 0xFFF2C000 : 0xFF8E99A1);
                      v.setInt(DC[i], "setBackgroundResource", i == today ? R.drawable.widget_today : 0);
                      cal.add(Calendar.DAY_OF_MONTH, 1);
                  }
                  v.setTextViewText(R.id.w_n2, km1(km));
                  v.setTextViewText(R.id.w_n3, String.format(Locale.GERMANY, "%,.0f", hm));
              }

              static RemoteViews build(Context c, boolean hike) {
                  SharedPreferences p = c.getSharedPreferences(PREF, Context.MODE_PRIVATE);
                  long now = System.currentTimeMillis();
                  // Laeuft die App nicht mehr (Absturz), zeigt das Widget nach 10 Minuten wieder "bereit".
                  boolean run = p.getBoolean("run", false) && now - p.getLong("ts", 0) < 10 * 60 * 1000;
                  RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget_tl);
                  v.setOnClickPendingIntent(R.id.w_root, act(c, "open", 1));
                  if (run) {
                      v.setViewVisibility(R.id.w_idle, View.GONE);
                      v.setViewVisibility(R.id.w_run, View.VISIBLE);
                      v.setViewVisibility(R.id.w_start, View.GONE);
                      v.setViewVisibility(R.id.w_stop, View.VISIBLE);
                      v.setViewVisibility(R.id.w_head, View.VISIBLE);
                      v.setTextViewText(R.id.w_head, "\u25CF  AUFNAHME L\u00C4UFT");
                      v.setTextColor(R.id.w_head, 0xFFFF6B5B);
                      long start = p.getLong("start", now);
                      long elapsed = Math.max(0, now - start);
                      v.setChronometer(R.id.w_time, SystemClock.elapsedRealtime() - elapsed, null, true);
                      v.setTextViewText(R.id.w_dist, p.getString("dist", "0,0"));
                      v.setTextViewText(R.id.w_gain, p.getString("gain", "0"));
                      v.setOnClickPendingIntent(R.id.w_stop, act(c, "stop", 3));
                  } else {
                      v.setViewVisibility(R.id.w_run, View.GONE);
                      v.setViewVisibility(R.id.w_idle, View.VISIBLE);
                      v.setViewVisibility(R.id.w_stop, View.GONE);
                      v.setViewVisibility(R.id.w_start, View.VISIBLE);
                      v.setViewVisibility(R.id.w_head, View.GONE);
                      if (hike) { v.setImageViewResource(R.id.w_ico, R.drawable.widget_hike_ic); v.setTextViewText(R.id.w_lab, "WANDERN"); }
                      week(v, p, hike);
                      v.setOnClickPendingIntent(R.id.w_start, hike ? act(c, "starthike", 4) : act(c, "start", 2));
                  }
                  return v;
              }
          }
