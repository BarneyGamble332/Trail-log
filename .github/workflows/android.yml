                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_hike_info" />
                  </receiver>
              </application>'''
          assert '</application>' in s
          s=s.replace('</application>',rec,1)
          perm=('    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n'
                '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n'
                '    <uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED" />\n'
                '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n'
                '    <uses-permission android:name="android.permission.ACCESS_MEDIA_LOCATION" />\n</manifest>')
          s=s.replace('</manifest>',perm,1)
          open(m,'w').write(s)
          st='android/app/src/main/res/values/strings.xml'
          t=open(st).read()
          open(st,'w').write(t.replace('</resources>','    <string name="widget_desc">Rad: Woche und Aufnahme starten</string>\n    <string name="widget_hike_desc">Wandern: Woche und Aufnahme starten</string>\n    <string name="widget_rad">Trail Log Rad</string>\n    <string name="widget_hike">Trail Log Wandern</string>\n</resources>',1))
          PY

      - name: Signaturschluessel einsetzen (gleich bei jedem Build, damit Updates klappen)
        run: |
          mkdir -p ~/.android
          echo '' | base64 -d > ~/.android/debug.keystore
          # Den festen Schlüssel ausdrücklich verwenden. Ohne das legt Gradle auf dem Runner einen eigenen
          # Zufallsschlüssel an und Android lehnt jedes Update ab („App nicht installiert“).
          cat >> android/app/build.gradle <<GRADLE

          android {
              signingConfigs {
                  debug {
                      storeFile file("$HOME/.android/debug.keystore")
                      storeType "pkcs12"
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes { debug { signingConfig signingConfigs.debug } }
          }
          GRADLE

      - name: APK bauen
        working-directory: android
        run: |
          ok=0
          for i in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then ok=1; break; fi
            echo "Versuch $i fehlgeschlagen, neuer Versuch in 30 s"; sleep 30
          done
          [ "$ok" = 1 ]

      - name: APK als Download bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Trail-Log.apk
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $AS verify --print-certs Trail-Log.apk | tee cert.txt
          grep -q "CN=Trail Log" cert.txt || { echo "::error::APK ist nicht mit dem festen Trail-Log-Schlüssel signiert"; exit 1; }
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Trail-Log.apk --title "Trail Log (Android)" --notes "Neueste Android-App. Datei Trail-Log.apk laden und installieren."
