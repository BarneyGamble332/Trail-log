              android:minWidth="250dp"
              android:minHeight="130dp"
              android:targetCellWidth="4"
              android:targetCellHeight="2"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_tl"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:description="@string/widget_desc" />
          XML

          python3 - <<'PY'
          m='android/app/src/main/AndroidManifest.xml'
          s=open(m).read()
          rec='''        <receiver android:name=".TrailWidgetProvider" android:exported="false">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_tl_info" />
                  </receiver>
              </application>'''
          assert '</application>' in s
          s=s.replace('</application>',rec,1)
          perm='    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n</manifest>'
          s=s.replace('</manifest>',perm,1)
          open(m,'w').write(s)
          st='android/app/src/main/res/values/strings.xml'
          t=open(st).read()
          open(st,'w').write(t.replace('</resources>','    <string name="widget_desc">Aufnahme starten und Live-Daten anzeigen</string>\n</resources>',1))
          PY

      - name: Signaturschluessel einsetzen (gleich bei jedem Build, damit Updates klappen)
        run: |
          mkdir -p ~/.android
          echo '' | base64 -d > ~/.android/debug.keystore
          # Den festen Schlüssel ausdrücklich verwenden. Ohne das legt Gradle auf dem Runner einen eigenen
          # Zufallsschlüssel an und Android lehnt jedes Update ab („App nicht installiert“).
          cat >> android/app/build.gradle <<GRADLE

          android {
              signingConfigs {
                  debug {
                      storeFile file("$HOME/.android/debug.keystore")
                      storeType "pkcs12"
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes { debug { signingConfig signingConfigs.debug } }
          }
          GRADLE

      - name: APK bauen
        working-directory: android
        run: |
          ok=0
          for i in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then ok=1; break; fi
            echo "Versuch $i fehlgeschlagen, neuer Versuch in 30 s"; sleep 30
          done
          [ "$ok" = 1 ]

      - name: APK als Download bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Trail-Log.apk
          AS=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $AS verify --print-certs Trail-Log.apk | tee cert.txt
          grep -q "CN=Trail Log" cert.txt || { echo "::error::APK ist nicht mit dem festen Trail-Log-Schlüssel signiert"; exit 1; }
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Trail-Log.apk --title "Trail Log (Android)" --notes "Neueste Android-App. Datei Trail-Log.apk laden und installieren."
