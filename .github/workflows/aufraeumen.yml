name: Probestück entfernen (einmalig)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  weg:
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in vorschau-gap-000.bin vorschau-gap.json; do gh release delete-asset karten "$a" -R "$GITHUB_REPOSITORY" -y || true; done
          gh release view karten -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'
